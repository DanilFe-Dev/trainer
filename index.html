<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#111418;--mut:#6b7480;--acc:#2f5bff;--ai:#fff;--g:#2fa866;--y:#e5a813;--r:#d9534f;--ln:#e3e6ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1014;--card:#171b21;--ink:#eceff3;--mut:#8a94a1;--acc:#7c9bff;--ai:#0b1020;--g:#3ccf84;--y:#f0bd3a;--r:#f27872;--ln:#262c35;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:28px;margin:.2em 0 .5em;letter-spacing:-.02em}h2{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:0 0 12px}
.card.hl,.cell.hl{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.note{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--y);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:10px;min-height:48px;padding:10px 14px;width:100%;margin:6px 0;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--ai);font-weight:700}
button.ic{width:auto;min-height:36px;margin:2px 0 2px 6px;padding:4px 10px;font-size:14px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;margin:4px 0 10px;width:100%}
label{display:block;font-size:14px;color:var(--mut)}label.chk{display:flex;gap:8px;align-items:center}label.chk input{width:auto;margin:0}
textarea{height:90px;font:12px monospace}
.row{display:flex;align-items:center;gap:6px}.sp{flex:1}.mut{color:var(--mut);font-size:13px}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.cells>*{display:flex;flex-direction:column;gap:2px;text-align:left}
.cell{border:1px solid var(--ln);border-radius:12px;padding:10px;margin:0;min-height:0}
.cells b{font-size:19px}.big{font-size:30px;font-weight:700;margin:6px 0}
.tag{font-size:12px;background:var(--acc);color:var(--ai);border-radius:6px;padding:2px 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.cal i{font-style:normal;text-align:center;color:var(--mut);font-size:12px}
.c{aspect-ratio:1;min-height:0;padding:0;margin:0;position:relative;border-radius:10px}
.c.g{background:var(--g);color:#fff;border-color:transparent}.c.y{background:var(--y);color:#111;border-color:transparent}.c.r{background:var(--r);color:#fff;border-color:transparent}
.c.t{outline:2px solid var(--ink);outline-offset:1px}
.c.d::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav{overflow-x:auto;scrollbar-width:none}#nav::-webkit-scrollbar{display:none}#nav button{flex:1 0 auto;width:auto;font-size:14px;white-space:nowrap;padding:14px 8px;border:0;border-radius:0;margin:0;background:none;color:var(--mut);box-shadow:inset 0 3px 0 transparent}#nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}#sh.o{display:flex}
#sh>div{background:var(--card);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
@media(min-width:900px){
#nav{right:auto;top:0;bottom:auto;width:170px;flex-direction:column;border-top:0;border-right:1px solid var(--ln);padding:20px 8px}
#nav{overflow:visible}#nav button{text-align:left;padding:12px;flex:none}#nav button.on{box-shadow:inset 3px 0 0 var(--acc)}#app{padding:24px 24px 24px 200px;max-width:1160px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}#sh{align-items:center}#sh>div{border-radius:16px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.chip{width:auto;min-height:38px;margin:0;padding:6px 12px}.chip.on{background:var(--acc);color:var(--ai);border-color:var(--acc)}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;margin:4px 0 10px;width:100%}
.timer{font:800 88px/1 system-ui,sans-serif;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0 20px}.timer.sm{font-size:44px;margin:6px 0 14px}
.num{font-size:28px;font-weight:700;text-align:center}.desc{font-size:18px;color:var(--mut);margin:0 0 12px}
table{width:100%;border-collapse:collapse}td{padding:8px 0;border-bottom:1px solid var(--ln)}td:last-child{text-align:right}
.dl{font-size:14px;font-weight:600;color:var(--mut)}
.ch{display:flex;justify-content:space-between;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:24px 2px 8px}
.xr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}.m{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px}
.ml{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}.mv{font-size:28px;font-weight:800;line-height:1.15;margin-top:2px}
.mv .dl{font-size:16px;font-weight:600;color:var(--acc);margin-left:6px}.mn{font-size:12px;color:var(--mut);margin-top:3px}
th{font-size:12px;font-weight:500;color:var(--mut);text-align:left;padding:0 0 6px}.tb td:not(:first-child),.tb th:not(:first-child){text-align:right}
.mc{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.mc::-webkit-scrollbar{display:none}.mc .chip{flex:none;min-height:34px;padding:4px 11px;font-size:14px}
.car{display:flex;align-items:center;gap:2px;margin-top:16px}
.nv{width:30px;min-height:40px;margin:0 0 20px;padding:0;font-size:22px;flex:none;border:0;background:none;color:var(--mut)}.nv:disabled{visibility:hidden}
button:disabled{opacity:.3;cursor:default}
.bars{flex:1;min-width:0;display:flex;align-items:flex-end;gap:14px;height:164px}
.b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bar{width:100%;max-width:64px;border-radius:8px 8px 3px 3px;background:var(--mut);opacity:.28}.b.l .bar{background:var(--acc);opacity:1}
.bv{font-weight:700;font-size:17px;line-height:1.2;text-align:center;font-variant-numeric:tabular-nums;margin-bottom:5px}.bd{font-size:12px;font-weight:500;color:var(--mut)}
.bl{font-size:12px;color:var(--mut);margin-top:8px}.b.l .bl{color:var(--ink);font-weight:600}
.lc{width:100%;height:auto;max-height:230px;margin-top:8px}
.bal{border-top:1px solid var(--ln);margin-top:12px;padding-top:12px}h3{margin:14px 0 4px;font-size:15px}
.fb{display:flex;align-items:center;justify-content:center;min-height:48px;margin:6px 0;padding:8px 12px;border:1px dashed var(--mut);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;text-align:center;overflow-wrap:anywhere;cursor:pointer}.fb:active{background:var(--ln)}
.goal{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 10%,var(--card)),var(--card))}
.gpill{background:var(--acc);color:var(--ai);border-radius:999px;padding:2px 11px;font-weight:700;font-size:13px}
.gbar{height:16px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--ln);margin:14px 0 6px}
.gbar i{display:block;height:100%;min-width:16px;border-radius:999px;position:relative;background:var(--acc);background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#fff))}
.gbar i::after{content:"";position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.gbar i.an{animation:gfill 1.1s cubic-bezier(.2,.8,.2,1)}@keyframes gfill{from{width:0}}
.gl{font-size:13px;color:var(--mut)}.gbig{font-size:26px;font-weight:800;letter-spacing:-.01em;margin-top:10px}
.gsub{font-size:18px;font-weight:700;color:var(--acc);margin:2px 0 6px}.gsub.gmut{font-size:15px;font-weight:500;color:var(--mut)}
.goal.ok .gbar i{background:var(--g)}.goal.ok .gsub{color:var(--g)}
@media(prefers-reduced-motion:reduce){.gbar i.an{animation:none}}
button{transition:transform .08s,background-color .25s,border-color .25s,color .25s}button:active{transform:scale(.97)}button.pri:active{filter:brightness(.9)}
button.ok{background:var(--g)!important;border-color:var(--g)!important;color:#fff!important;animation:pop .4s}@keyframes pop{0%{transform:scale(.96)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
.note{position:relative;padding-right:44px}.note .x{position:absolute;right:4px;top:4px;width:34px;min-height:34px;margin:0;padding:0;border:0;background:none;color:var(--mut);font-size:16px}
@media(prefers-reduced-motion:reduce){button,button.ok{transition:none;animation:none}}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,420px);text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20}#toast.o{opacity:1;transform:translate(-50%,0)}
.run{display:flex;flex-direction:column;min-height:calc(100vh - 112px - env(safe-area-inset-top,0px))}
@supports(height:100dvh){.run{min-height:calc(100dvh - 112px - env(safe-area-inset-top,0px))}}
.run .acts{margin-top:auto;padding-top:12px}.run .timer.sm{font-size:56px;margin:8px 0 18px}
.rb{height:4px;border-radius:999px;background:var(--ln);margin:0 0 16px;overflow:hidden}.rb i{display:block;height:100%;border-radius:999px;background:var(--acc);transition:width .4s}
.tl{display:grid;gap:8px;margin:8px 0}.tl.c2{grid-template-columns:1fr 1fr}.tl.c3{grid-template-columns:repeat(3,1fr)}
.tl>div{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tl.c3>div{padding:10px}.tl .tk,.tl .tn{font-size:12px;color:var(--mut);line-height:1.25}.tl .tv{font-size:22px;font-weight:700;line-height:1.25;margin-top:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.pn{font-size:19px;font-weight:700;margin-top:6px}.pb+.pb{border-top:1px solid var(--ln);margin-top:12px;padding-top:6px}
.bt{display:grid;grid-template-columns:2fr 1fr;gap:8px}.bt button{margin:8px 0 0}
.g2,.g3{display:grid;gap:0 10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr);gap:0 8px}.g2>label,.g3>label{min-width:0}
.gr{display:block;width:36px;height:4px;border-radius:999px;background:var(--ln);margin:-8px auto 14px}
.mc{position:relative}#pfd:empty{display:none}#em{color:var(--r);margin:0 0 6px}#em:empty{display:none}
@media(min-width:900px){.gr{display:none}.run{max-width:560px;margin:0 auto}}
</style>
</head>
<body>
<div id="app"></div>
<div id="nav"><button data-a="tab" data-t="home">Главная</button><button data-a="tab" data-t="tr">Тренировки</button><button data-a="tab" data-t="stat">Статистика</button><button data-a="tab" data-t="prof">Профиль</button></div>
<div id="sh"></div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),fm=n=>Math.round(n*10)/10;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),dt=s=>new Date(s+'T12:00:00');
const add=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((dt(a)-dt(b))/864e5);
const dlab=s=>dt(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const bad=(l,m)=>{let f=false;l.forEach(([s,ok])=>{const e=$(s);if(e)e.style.borderColor=ok?'':'var(--r)';if(!ok)f=true});if(f){const e=$('#em');if(e)e.textContent=m;else toast(m)}return f};
const num=v=>{v=String(v).replace(',','.').trim();const n=parseFloat(v);return v===''||isNaN(n)||n<0?null:n};
const sg=n=>n==null?'—':(n>0?'+':n<0?'−':'')+String(Math.abs(fm(n))).replace('.',',');
const DEF=()=>({v:1,goals:[],days:{},meas:{},set:{eve:'22:00',per:28},cats:['Руки','Ноги','Грудь','Спина','Плечи'].map((n,i)=>({id:'c'+(i+1),n})),ex:[],pl:[],ses:[],pf:{}});
let D=DEF(),ui={tab:'home',sv:'',cal:false,mo:0,hb:false},cerr=false;
/* --- хранилище: Telegram CloudStorage (кусками, пишутся только изменённые) + копия в браузере --- */
const TG=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData?Telegram.WebApp:null,CS=TG&&TG.CloudStorage;
const cs=(m,...a)=>new Promise((ok,no)=>CS[m](...a,(e,r)=>e?no(e):ok(r)));
let sent=[];
const ser=()=>JSON.stringify({ts:D.ts,v:D.v,set:D.set,goals:D.goals,cats:D.cats,ex:D.ex,pl:D.pl,meas:D.meas,pf:D.pf,ses:D.ses,days:D.days});
async function pull(){const n=+(await cs('getItem','n'))||0;if(!n)return null;const ks=Array.from({length:n},(_,i)=>'d'+i),r=await cs('getItems',ks);return ks.map((k,i)=>Array.isArray(r)?r[i]:r[k])}
async function persist(){
 const s=ser();try{localStorage.setItem('wt2',s)}catch(e){}
 if(!CS)return;
 try{const a=s.replace(/[^\x00-\x7f]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0')),ch=[];
  for(let i=0;i<a.length;i+=3500)ch.push(a.slice(i,i+3500));
  const old=+(await cs('getItem','n'))||0;
  for(let i=0;i<ch.length;i++)if(sent[i]!==ch[i]){await cs('setItem','d'+i,ch[i]);sent[i]=ch[i]}
  if(old!==ch.length)await cs('setItem','n',String(ch.length));
  if(old>ch.length)await cs('removeItems',Array.from({length:old-ch.length},(_,i)=>'d'+(ch.length+i)));
  sent.length=ch.length;cerr=false}catch(e){cerr=true}}
let q=Promise.resolve();const save=()=>{if(!D.set.t0)D.set.t0=today();D.ts=Date.now();q=q.then(persist).catch(()=>{})};
const adopt=s=>{const o=JSON.parse(s);D=Object.assign(DEF(),o);D.set=Object.assign(DEF().set,o.set);mig()};
async function load(){
 let s=null,cloud=false;
 if(CS){try{const v=await pull();if(v){s=v.join('');sent=v;cloud=true}}catch(e){cerr=true}}
 if(!s){try{s=localStorage.getItem('wt2')}catch(e){}}
 if(s){try{adopt(s);if(mg){mg=false;save()}}catch(e){}}
 if(CS&&!cloud&&s)save()}
/* --- логика --- */
const goal=ds=>{let r=D.goals[0];for(const x of D.goals)if(x.from<=ds)r=x;return r||null};
const first=()=>D.set.t0||null;
function st(ds){
 const t=today(),f=first(),g=goal(ds);
 if(ds>t||!f||!g||g.k==null||g.p==null)return'';
 const r=D.days[ds]||{},a=r.k!=null,b=r.p!=null;
 if(ds<f&&!a&&!b)return'';
 if(ds===t&&!(a&&b)&&!r.x)return'';
 const sc=sched(ds),tot=2+(sc?1:0),n=(a&&r.k<=g.k)+(b&&r.p>=g.p)+(sc&&isdone(ds)?1:0);return n===tot?'g':n?'y':'r'}
const inc=ds=>{const f=first(),t=today();if(!f||ds<f||ds>=t||ds<add(t,-7))return false;const r=D.days[ds]||{};return !r.x&&(r.w==null||r.k==null||r.p==null)};
function miss(){const f=first();if(!f)return null;for(let i=1;i<=7;i++){const d=add(today(),-i);if(d<f)break;const r=D.days[d]||{};if(r.x)continue;const m=[];if(r.w==null)m.push('вес');if(r.k==null)m.push('калории');if(r.p==null)m.push('белок');if(m.length)return{d,m}}return null}
/* --- экраны --- */
function vHome(){
 const t=today(),r=D.days[t]||{},g=goal(t),late=new Date().toTimeString().slice(0,5)>=D.set.eve,m=miss();
 const cell=(l,v,u,hl,s)=>`<button class="cell${hl?' hl':''}" data-a="day" data-d="${t}"><span class="mut">${l}</span><b>${v==null?'—':dc(fm(v))+u}</b><span class="mut">${s}</span></button>`;
 const wait=late?'внесите':'вечером';
 return `<h1>Сегодня</h1><div class="mut" style="margin:-6px 0 12px">${dt(t).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div>`
 +(!g&&!D.set.hg?`<div class="note">Задайте цели в профиле, и заработают календарь и подсказки.<button class="ic" data-a="tab" data-t="prof">Открыть</button><button class="ic x" data-a="hg" aria-label="Закрыть">✕</button></div>`:'')
 +(m&&!ui.hb?`<div class="note">За ${dlab(m.d)} не внесено: ${m.m.join(', ')}.<button class="ic" data-a="day" data-d="${m.d}">Внести</button><button class="ic" data-a="skip" data-d="${m.d}">Пропустить</button><button class="ic x" data-a="hb" aria-label="Скрыть">✕</button></div>`:'')
 +vWk()+vGoal()+`<div class="two"><div class="card"><div class="cells">`
 +cell('Вес',r.w,' кг',r.w==null,r.w==null?'утром':(g&&g.w?'цель '+dc(g.w):''))
 +cell('Калории',r.k,'',late&&r.k==null,r.k==null?wait:(g?(r.k<=g.k?'в норме':'выше на '+fm(r.k-g.k)):''))
 +cell('Белок',r.p,' г',late&&r.p==null,r.p==null?wait:(g?(r.p>=g.p?'цель есть':'не хватает '+fm(g.p-r.p)):''))
 +`</div><button class="pri" data-a="day" data-d="${t}">Внести данные</button></div>`
 +vCal()+vWeight(wchg())+vNut()+vMeas()+`</div>`}
function vCal(){
 const t=today(),W=['пн','вт','ср','чт','пт','сб','вс'];let days=[],title='Эта неделя';
 if(!ui.cal){const o=(new Date().getDay()+6)%7;for(let i=0;i<7;i++)days.push(add(t,i-o))}
 else{const n0=new Date(),b=new Date(n0.getFullYear(),n0.getMonth()+ui.mo,1);title=b.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const n=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();
  for(let i=0;i<(b.getDay()+6)%7;i++)days.push(null);
  for(let i=1;i<=n;i++)days.push(iso(new Date(b.getFullYear(),b.getMonth(),i)))}
 return `<div class="card"><div class="row"><b>${title}</b><span class="sp"></span>${ui.cal?'<button class="ic" data-a="mo" data-n="-1" aria-label="Назад">‹</button><button class="ic" data-a="mo" data-n="1" aria-label="Вперёд">›</button>':''}<button class="ic" data-a="cal">${ui.cal?'Неделя':'Месяц'}</button></div><div class="cal">${W.map(x=>`<i>${x}</i>`).join('')}${days.map(ds=>ds?`<button class="c ${st(ds)}${ds===t?' t':''}${inc(ds)?' d':''}" data-a="day" data-d="${ds}">${+ds.slice(8)}</button>`:'<i></i>').join('')}</div></div>`}

const pfok=()=>{const p=D.pf||{};return !!(p.sex&&p.by&&p.h&&p.act!=null)};
function wAt(ds){let r=null,f=null;for(const k of Object.keys(D.days).sort()){const w=D.days[k].w;if(w==null)continue;if(f==null)f=w;if(k<=ds)r=w}return r!=null?r:f}
const r10=n=>Math.round(n/10)*10,f0=n=>Math.round(n).toLocaleString('ru-RU');
function base(ds){if(!pfok())return null;const w=wAt(ds);if(w==null)return null;const p=D.pf;return r10((10*w+6.25*p.h-5*(+ds.slice(0,4)-p.by)+(p.sex==='m'?5:-161))*ACT[p.act][2])}
function kcal(s){if(!pfok()||!s.dur||!okS(s))return null;const w=wAt(s.date);if(w==null)return null;const rv=(s.rs||[]).filter((_,j)=>s.s[j]&&s.s[j].r>0),rs=rv.length?mean(rv):90,met=Math.max(3.5,Math.min(6,3.5+(120-rs)/75*2.5));return r10((met-1)*w*Math.min(s.dur,9000)/3600)}
function exp(ds){const b=base(ds);return b==null?null:b+D.ses.filter(s=>s.date===ds).reduce((a,s)=>a+(kcal(s)||0),0)}
const bal=ds=>{const r=D.days[ds],e=exp(ds);return r&&r.k!=null&&e!=null?r.k-e:null};
const bst=b=>Math.abs(b)<=100?'поддержание':b>0?'профицит':'дефицит';
const sgn=n=>(n>0?'+':n<0?'−':'')+f0(Math.abs(n));
function bcol(b,t){if(!t)return'var(--ink)';const a=Math.abs(b);if(t==='keep')return a<=150?'var(--g)':a<=400?'var(--y)':'var(--r)';const g=t==='loss'?-b:b;return g>=100?'var(--g)':g>-100?'var(--y)':'var(--r)'}
function bchart(){
 const n=ui.cp||30,ds=days(n),v=ds.map(bal);
 if(v.every(x=>x==null))return '<p class="mut">Нет данных: нужны профиль, вес и внесённые калории.</p>';
 const mx=Math.max(...v.filter(x=>x!=null).map(Math.abs),300)*1.15,W=292/n,Z=60;
 return `<svg viewBox="0 0 320 132" class="lc" role="img" aria-label="График баланса">`
 +v.map((x,i)=>{if(x==null)return'';const h=Math.max(1.5,Math.abs(x)/mx*48);return `<rect x="${(14+i*W+W*.15).toFixed(1)}" y="${(x>=0?Z-h:Z).toFixed(1)}" width="${(W*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(3,W*.3).toFixed(1)}" fill="${bcol(x,(goal(ds[i])||{}).t)}"/>`}).join('')
 +`<line x1="14" x2="306" y1="${Z}" y2="${Z}" stroke="var(--ink)" opacity=".4"/><text x="306" y="10" text-anchor="end" font-size="10" fill="var(--mut)">профицит</text><text x="306" y="118" text-anchor="end" font-size="10" fill="var(--mut)">дефицит</text><text x="14" y="128" font-size="10" fill="var(--mut)">${fd(ds[0])}</text><text x="306" y="128" text-anchor="end" font-size="10" fill="var(--mut)">${fd(ds[n-1])}</text></svg>`}
function vNut(){
 const d7=days(7),r=d7.map(d=>D.days[d]||{}),av=k=>{const a=r.filter(x=>x[k]!=null).map(x=>x[k]);return a.length?Math.round(mean(a)):null},ak=av('k'),ap=av('p');
 const t=today(),g=goal(t)||{},gt=g.t,e=exp(t),b=bal(t),bs=d7.map(bal).filter(x=>x!=null),sum=bs.reduce((a,x)=>a+x,0),avg=bs.length?sum/bs.length:0;
 const tile=(k,v,n,c)=>`<div><span class="tk">${k}</span><b class="tv"${c?` style="color:${c}"`:''}>${v}</b><span class="tn">${n||'&nbsp;'}</span></div>`;
 const bl=e==null?'':`<div class="bal"><div class="mut">Баланс, ккал</div><div class="tl c2">${tile('Сегодня',b==null?'—':sgn(b),b==null?'нужны калории':bst(b),b==null?'':bcol(b,gt))}${bs.length?tile('За 7 дней',sgn(sum),bst(avg)+(bs.length<7?' · дней: '+bs.length:''),bcol(avg,gt)):tile('За 7 дней','—','нет данных')}</div><div class="mut">расход ≈ ${f0(e)}${b==null?' · внесите калории вечером':' · съедено '+f0(D.days[t].k)}</div></div>`;
 return `<div class="card"><div class="row"><b>Питание</b><span class="sp"></span><button class="ic" data-a="ck">${ui.ck?'Скрыть график':'График'}</button></div><div class="mut" style="margin:-2px 0 0">Среднее за 7 дней</div><div class="tl c2">${tile('Калории',ak!=null?f0(ak):'—',g.k?'цель до '+f0(g.k):'')}${tile('Белок',ap!=null?ap+' г':'—',g.p?'цель от '+g.p+' г':'')}</div>${bl}${ui.ck?`${pc()}<div class="mc" style="margin-top:8px"><button class="chip${ui.cm!=='p'&&ui.cm!=='b'?' on':''}" data-a="cmet" data-k="k">Калории</button><button class="chip${ui.cm==='p'?' on':''}" data-a="cmet" data-k="p">Белок</button>${pfok()?`<button class="chip${ui.cm==='b'?' on':''}" data-a="cmet" data-k="b">Баланс</button>`:''}</div>${nchart()}`:''}</div>`}
function vProf(){
 const g=goal(today())||{},s=D.set,p=D.pf||{},ok=pfok(),ed=ui.pe||!ok,b=base(today()),yr=n=>{const a=n%10,c=n%100;return a===1&&c!==11?'год':a>=2&&a<=4&&(c<10||c>=20)?'года':'лет'},age=ok?new Date().getFullYear()-p.by:0;
 const about=ed?`<div class="card"><b>О вас</b><label>Пол<select id="pfs"><option value=""${p.sex?'':' selected'}>Выберите</option><option value="m"${p.sex==='m'?' selected':''}>Мужской</option><option value="f"${p.sex==='f'?' selected':''}>Женский</option></select></label><label>Год рождения<input id="pfb" inputmode="numeric" value="${p.by??''}" placeholder="например, 1995"></label><label>Рост, см<input id="pfh" inputmode="decimal" value="${p.h??''}"></label><label>Активность в течение дня (без тренировок)<select id="pfa"><option value=""${p.act!=null?'':' selected'}>Выберите</option>${ACT.map((a,i)=>`<option value="${i}"${p.act===i?' selected':''}>${a[0]}</option>`).join('')}</select><div class="mut" id="pfd" style="margin:-4px 0 10px">${p.act!=null&&ACT[p.act]?esc(ACT[p.act][1]):''}</div></label><button class="pri" data-a="pfsave">Сохранить</button>${ok?'<button data-a="pfedit">Отмена</button>':''}<div class="mut" id="pfm" style="color:var(--r)"></div></div>`
 :`<div class="card"><div class="row"><b>О вас</b><span class="sp"></span><button class="ic" data-a="pfedit" aria-label="Изменить">✎</button></div><p style="margin:6px 0 2px">${p.sex==='m'?'Мужчина':'Женщина'} · ${age} ${yr(age)} · ${esc(p.h)} см</p><p style="margin:0 0 12px">${ACT[p.act][0]}</p><div class="row" style="border-top:1px solid var(--ln);padding-top:12px"><span class="mut">Базовый расход</span><span class="sp"></span><b style="font-size:22px">${b!=null?f0(b)+' ккал':'—'}</b></div>${b==null?'<div class="mut">Нужен хотя бы один замер веса.</div>':''}</div>`;
 return `<h1>Профиль</h1>${about}<div class="card"><b>Цели</b><label>Моя цель<select id="gt"><option value="">Не выбрана</option>${[['loss','Похудение'],['keep','Поддержание'],['gain','Набор массы']].map(([v,l])=>`<option value="${v}"${g.t===v?' selected':''}>${l}</option>`).join('')}</select></label><label>Целевой вес, кг<input id="gw" inputmode="decimal" value="${g.w??''}"></label><label>Калории: не больше, ккал<input id="gk" inputmode="numeric" value="${g.k??''}"></label>${b!=null?`<div class="mut" style="margin:-4px 0 10px">Поддержание примерно ${f0(b)} ккал (базовый расход)</div>`:''}<label>Белок: не меньше, г<input id="gp" inputmode="numeric" value="${g.p??''}"></label><label>Время вечернего ввода<input id="ge" type="time" value="${s.eve}"></label><label>Напоминать о замерах (талия, бицепсы, плечи) раз в, дней<input id="gm" inputmode="numeric" value="${s.per}"></label><button class="pri" data-a="goals">Сохранить</button><p class="mut">Новая цель действует с сегодняшнего дня, прошлые дни оцениваются по прежним целям. Цель (похудение, поддержание, набор) определяет цвет баланса калорий.</p></div>
<div class="card"><b>Данные</b><p class="mut">Хранилище: ${CS?'Telegram Cloud, общее для ваших устройств'+(cerr?' (была ошибка записи)':''):'этот браузер, только это устройство'}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px"><button data-a="exj">Копия (JSON)</button><button data-a="exc">CSV: дни</button><button data-a="exm">CSV: замеры</button><button data-a="exs">CSV: подходы</button></div><div class="mut" style="margin:4px 0 10px">JSON — полная копия для восстановления, внутри описание всех полей. CSV — таблицы для Google Таблиц и Excel.</div><textarea id="bk" placeholder="Здесь появится текст копии. Сюда же можно вставить копию для загрузки."></textarea><h3>Загрузить сохранение</h3><div class="mut" style="margin-bottom:6px">Выберите файл .json или вставьте текст копии в поле выше, затем нажмите кнопку.</div><label class="fb" for="fi" id="fl">Выбрать файл (.json)</label><input type="file" id="fi" accept=".json,.txt" hidden><button data-a="imp">Загрузить сохранение</button><div class="mut" id="ms"></div></div>`}
/* --- карточка цели: сколько осталось --- */
const pl=(n,f)=>{const a=n%10,b=n%100;return a===1&&b!==11?f[0]:a>=2&&a<=4&&(b<10||b>=20)?f[1]:f[2]},dc=x=>String(x).replace('.',','),sgk=n=>{const v=Math.round(Math.abs(n)*10)/10;return (n>0&&v?'+':n<0&&v?'−':'')+dc(v)};
function gtrend(){
 const k=Object.keys(D.days).filter(d=>D.days[d].w!=null&&d<=today()&&diff(today(),d)<=28).sort();if(k.length<2)return null;
 const xs=k.map(d=>diff(d,k[0])),ys=k.map(d=>D.days[d].w),mx=mean(xs),my=mean(ys);let sxx=0,sxy=0;xs.forEach((x,i)=>{sxx+=(x-mx)**2;sxy+=(x-mx)*(ys[i]-my)});
 return sxx?{s:sxy/sxx,n:k.length}:null}
function vGoal(){
 const g=goal(today());if(!g||g.t==='keep')return '';
 if(!(g.t==='loss'||g.t==='gain')||g.w==null)return D.set.hg?'':`<div class="note">Чтобы здесь появилась шкала цели, выберите в профиле цель (похудение или набор массы) и укажите целевой вес.<button class="ic" data-a="tab" data-t="prof">Открыть профиль</button><button class="ic x" data-a="hg" aria-label="Закрыть">✕</button></div>`;
 const c=wchg();if(!c)return D.set.hg?'':'<div class="note">Внесите вес, и здесь появится шкала цели.'+'<button class="ic x" data-a="hg" aria-label="Закрыть">✕</button>'+'</div>';
 const loss=g.t==='loss',cw=c.cw,tw=g.w,s0=wAt(g.sd||g.from),sw=loss?Math.max(s0,cw):Math.min(s0,cw),tot=Math.abs(sw-tw),rem=loss?cw-tw:tw-cw,done=rem<=0,pct=done||!tot?100:Math.round(Math.max(0,Math.min(1,1-rem/tot))*100);
 const an=ui.ga?'':'an';ui.ga=true;
 let tr=gtrend(),sl=tr?tr.s:null,src='по динамике веса',few=tr?tr.n<7:true;
 if(sl==null){const bs=days(14).map(bal).filter(x=>x!=null);if(bs.length){sl=mean(bs)/7700;src='по балансу калорий';few=bs.length<7}}
 let main,sub='',pace='';
 if(done){main='Цель достигнута';sub=dc(fm(Math.abs(cw-s0)))+' кг от старта'}
 else{main='Осталось '+dc(fm(rem))+' кг';
  if(sl==null)sub='Накопим данные: нужно два замера веса';
  else if(loss?sl>=0:sl<=0)sub='Темп пока не в сторону цели';
  else{const v=Math.abs(sl),n=Math.ceil(rem/v);
   if(n>730)sub='больше двух лет';else{const dd=dt(add(today(),n));
    sub=(n<21?'≈ '+n+' '+pl(n,['день','дня','дней']):n<=365?'≈ '+Math.round(n/7)+' '+pl(Math.round(n/7),['неделя','недели','недель']):'≈ '+Math.round(n/30.4)+' '+pl(Math.round(n/30.4),['месяц','месяца','месяцев']))+' · к '+dd.toLocaleDateString('ru-RU',Object.assign({day:'numeric',month:'long'},dd.getFullYear()!==new Date().getFullYear()?{year:'numeric'}:{}))}}
  if(sl!=null)pace=`<div class="mut">${sgk(sl*7)} кг в неделю · ${src}${few?' · уточняется':''}</div>`}
 return `<div class="card goal${done?' ok':''}"><div class="row"><b>Цель: ${loss?'похудение':'набор массы'}</b><span class="sp"></span><span class="gpill">${pct}%</span></div><div class="gbar"><i class="${an}" style="width:${pct}%"></i></div><div class="row gl"><span>${dc(fm(sw))} кг</span><span class="sp"></span><span>${dc(fm(tw))} кг</span></div><div class="gbig">${main}</div><div class="gsub${sub.startsWith('Накопим')||sub.startsWith('Темп')?' gmut':''}">${sub}</div>${pace}</div>`}
function toast(t){const e=$('#toast');if(!e)return;e.textContent=t;e.classList.add('o');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('o'),3400)}
function flash(sel,txt){const b=document.querySelector(sel);if(!b)return;const o=b.textContent;b.textContent=txt||'Сохранено ✓';b.classList.add('ok');try{TG&&TG.HapticFeedback&&TG.HapticFeedback.notificationOccurred('success')}catch(e){}setTimeout(()=>{if(b.isConnected){b.textContent=o;b.classList.remove('ok')}},1700)}

  ts:'метка времени последнего сохранения (мс)'}};
function exportJSON(){return JSON.stringify(Object.assign({_about:Object.assign({exported:new Date().toISOString()},ABOUT)},JSON.parse(ser())),null,1)}
const q2=v=>'"'+String(v).replace(/"/g,'""')+'"',n2=v=>v==null?'':v;

(async()=>{
 if(TG){try{TG.ready();TG.expand();TG.disableVerticalSwipes&&TG.disableVerticalSwipes()}catch(e){}}
 await load();restoreR();render();
 setInterval(()=>{if(ui.tab==='home'&&!R&&!ui.sv&&!$('#sh').classList.contains('o'))render()},60000)})();
